action_type: waypoints
rate_hz: 1
sensor_needs: [image]
controls_orientation: false
goal_inputs: [pose]
signals: []

chunk:
  execute_s: 1.0
  lookahead_m: 0.5
  speed_mps: 0.5

depends:
  global_plan: true

config:
  device: cuda
  variant: qwen2.5-vl
  step_scale_m: 0.5
  goal_clip_m: 10.0
  samples: 16
  prompt: >-
    You are a robot navigating to a target point. The images are your last five observations, the last one
    being the current view. Your positions at those observations were
    <input_pos1><input_pos2><input_pos3><input_pos4><input_pos5> and the target is at <input_target>.
    Predict the next five waypoints.

observations:
  aliases: {}

  datasources:
    robot_pose:
      type: RobotPoseTFGenerator
      params: {}

    camera:
      type: sensor_msgs/Image
      params:
        sensor: image
        output_size: [640, 480]

    robot_pose_from_tf:
      type: RobotPoseTFGenerator
      params: {}

    goal_pose:
      type: geometry_msgs/PoseStamped
      params:
        topic: goal_pose

    global_plan:
      type: nav_msgs/Path
      params:
        topic: plan

    costmap:
      type: nav_msgs/OccupancyGrid
      params:
        topic: global_costmap/costmap

    subgoal:
      type: SubgoalGenerator
      params:
        lookahead: 6.0
