[project]
name = "arena_planners_socialnav"
version = "0.0.0"
description = "SocialNav planner adapter for arena_planners bridge."
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "torch>=2.14",
    "torchvision",
    "transformers==4.57.1",
    "accelerate",
    "safetensors",
    "huggingface_hub>=0.19.3,<1.0",
    "numpy",
    "pillow",
    "pyyaml",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 120
extend-exclude = ["socialnav_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["socialnav_model", "scene"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
